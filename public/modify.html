<!doctype html>
<html lang="fa">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>ویرایش PDF</title>
	<style>
		body { font-family: sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
		fieldset { margin-bottom: 1rem; }
		#result { margin-top: 1rem; }
		label { display: block; margin: .4rem 0; }
		input[type="text"], input[type="number"], select { padding: .3rem; min-width: 240px; }
		.summary { background: #f7f7f7; padding: .6rem; border-radius: 6px; }
	</style>
</head>
<body>
	<h1>ویرایش PDF</h1>
	<p class="summary">می‌توانید واترمارک اضافه کنید، صفحات را بچرخانید یا صفحات خاص را استخراج کنید.</p>
	<form id="modifyForm">
		<fieldset>
			<legend>ورودی</legend>
			<label>آپلود فایل جدید یا نام فایل موجود در uploads</label>
			<input id="file" name="file" type="file" accept="application/pdf,.pdf" />
			<br/>
			<label for="filename">یا نام فایل موجود:</label>
			<input id="filename" name="filename" type="text" placeholder="12345-input.pdf" />
		</fieldset>

		<fieldset>
			<legend>عملیات</legend>
			<label for="action">عملیات:</label>
			<select id="action" name="action" required>
				<option value="watermark">watermark</option>
				<option value="rotate">rotate</option>
				<option value="extract">extract</option>
			</select>

			<div id="watermarkOptions">
				<label for="text">متن واترمارک:</label>
				<input id="text" name="text" type="text" value="CONFIDENTIAL" />
				<label for="size">اندازه فونت:</label>
				<input id="size" name="size" type="number" value="48" />
				<label for="angle">زاویه:</label>
				<input id="angle" name="angle" type="number" value="45" />
			</div>

			<div id="rotateOptions" style="display:none">
				<label for="degrees">درجه چرخش:</label>
				<input id="degrees" name="degrees" type="number" value="90" />
			</div>

			<div>
				<label for="pages">صفحات (مثال: 1,3-5 یا all):</label>
				<input id="pages" name="pages" type="text" value="all" />
			</div>
		</fieldset>

		<button type="submit">اجرا</button>
	</form>

	<div id="result"></div>

	<script>
	const actionSelect = document.getElementById('action');
	const wm = document.getElementById('watermarkOptions');
	const ro = document.getElementById('rotateOptions');
	actionSelect.addEventListener('change', () => {
		const v = actionSelect.value;
		wm.style.display = v === 'watermark' ? 'block' : 'none';
		ro.style.display = v === 'rotate' ? 'block' : 'none';
	});

	document.getElementById('modifyForm').addEventListener('submit', async (e) => {
		e.preventDefault();
		const formData = new FormData();
		const file = document.getElementById('file').files[0];
		const filename = document.getElementById('filename').value.trim();
		const action = document.getElementById('action').value;
		const pages = document.getElementById('pages').value.trim();
		if (file) formData.append('file', file);
		if (filename) formData.append('filename', filename);
		formData.append('action', action);
		formData.append('pages', pages);
		if (action === 'watermark') {
			formData.append('text', document.getElementById('text').value);
			formData.append('size', document.getElementById('size').value);
			formData.append('angle', document.getElementById('angle').value);
		}
		if (action === 'rotate') {
			formData.append('degrees', document.getElementById('degrees').value);
		}
		document.getElementById('result').textContent = 'در حال پردازش...';
		try {
			const res = await fetch('/api/pdf/modify', { method: 'POST', body: formData });
			const data = await res.json();
			if (!res.ok) throw new Error(data.error || 'failed');
			document.getElementById('result').innerHTML = `
				<p>موفق! فایل خروجی: <a href="${data.file.url}" target="_blank" rel="noopener">${data.file.url}</a></p>
			`;
		} catch (err) {
			document.getElementById('result').textContent = 'خطا: ' + err.message;
		}
	});
	</script>
</body>
</html>
